name: Build

# Builds on pushes and pull requests that touch the mod itself. Documentation-only
# changes skip the build; add "[skip ci]" to a commit message to skip any push, or run
# the workflow from the Actions tab to build on demand.
on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]
    paths-ignore:
      - "**.md"
      - "LICENCE*"
      - "updates.json"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENCE*"
      - "updates.json"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tfmg-build-${{ github.run_number }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
